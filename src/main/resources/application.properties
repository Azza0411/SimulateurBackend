spring.application.name=demo
spring.datasource.url=jdbc:mysql://localhost:3306/springaout?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDateTimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Optimisations pour MySQL 8
spring.jpa.properties.hibernate.connection.charSet=utf8mb4
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.useUnicode=true
server.port=8082
# Swagger (SpringDoc) Minimal
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tryItOutEnabled=true
# Configuration upload
app.upload.dir=./uploads
app.upload.max-file-size=50MB
app.upload.allowed-image-types=jpg,jpeg,png,gif
app.upload.allowed-video-types=mp4,avi,mov
# Configuration serveur pour servir les fichiers statiques
server.servlet.context-path=/api
# Multipart (nouveau/ajouté)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-request-size=50MB
# Augmenté pour vidéos (commentaire séparé)
spring.servlet.multipart.max-file-size=50MB
#clé Gemini
gemini.api.key=AIzaSyA94dq5eMLTbyr5X-9On7nJLQ-TKYhFQnQ
